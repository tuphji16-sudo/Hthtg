<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Outer security orbit circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.6"/>

  <!-- Center Shield -->
  <path d="M256 90 L380 150 V265 C380 345 325 410 256 430 C187 410 132 345 132 265 V150 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner dark cutout for contrast -->
  <path d="M256 120 L355 168 V260 C355 325 310 380 256 398 C202 380 157 325 157 260 V168 Z" 
        fill="#0a0d12"/>

  <!-- Arabic Calligraphic Letter 'Atheer' Alif with glow and orbit accent -->
  <text x="256" y="300" 
        font-family="Cairo, Arial, sans-serif" 
        font-weight="900" 
        font-size="160" 
        fill="#10b981" 
        text-anchor="middle">أ</text>

  <!-- Quantum Star / Signal Dot -->
  <circle cx="340" cy="170" r="14" fill="#38bdf8"/>
  <circle cx="340" cy="170" r="22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
</svg>
